name: Build and Test

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]
  release:
    types: [ created ]

env:
  GO_VERSION: '1.21'
  RUST_VERSION: 'stable'
  NODE_VERSION: '20'
  CIRCOM_VERSION: '2.1.6'

jobs:
  build:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
        arch: [amd64, arm64]
        exclude:
          # Exclude combinations that don't exist
          - os: ubuntu-latest
            arch: arm64
          - os: macos-latest
            arch: amd64

    runs-on: ${{ matrix.os }}
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        lfs: true
        submodules: recursive

    - name: Setup Go
      uses: actions/setup-go@v4
      with:
        go-version: ${{ env.GO_VERSION }}

    - name: Setup Rust
      uses: actions-rs/toolchain@v1
      with:
        toolchain: ${{ env.RUST_VERSION }}
        override: true
        components: rustfmt, clippy

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: ${{ env.NODE_VERSION }}

    - name: Cache dependencies
      uses: actions/cache@v3
      with:
        path: |
          ~/.cache/go-build
          ~/go/pkg/mod
          ~/.cargo/registry
          ~/.cargo/git
          target/
          node_modules/
        key: ${{ runner.os }}-${{ matrix.arch }}-deps-${{ hashFiles('**/go.sum', '**/Cargo.lock', '**/package-lock.json') }}
        restore-keys: |
          ${{ runner.os }}-${{ matrix.arch }}-deps-

    - name: Install system dependencies (Ubuntu)
      if: matrix.os == 'ubuntu-latest'
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          build-essential \
          cmake \
          libgmp-dev \
          nlohmann-json3-dev \
          nasm

    - name: Install system dependencies (macOS)
      if: matrix.os == 'macos-latest'
      run: |
        brew install cmake gmp nlohmann-json nasm

    - name: Install Circom
      run: |
        if [ "${{ matrix.os }}" = "ubuntu-latest" ]; then
          OS="linux"
        else
          OS="darwin"
        fi
        curl -L "https://github.com/iden3/circom/releases/download/v${{ env.CIRCOM_VERSION }}/circom-${OS}-${{ matrix.arch }}" -o circom
        chmod +x circom
        sudo mv circom /usr/local/bin/

    - name: Install SnarkJS
      run: npm install -g snarkjs

    - name: Build RISC Zero
      working-directory: ./risc0
      run: cargo build --release

    - name: Build Go application
      run: |
        go mod download
        go build -v -o ppem ./cmd/ppem
      env:
        CGO_ENABLED: 0
        GOOS: ${{ matrix.os == 'ubuntu-latest' && 'linux' || 'darwin' }}
        GOARCH: ${{ matrix.arch }}

    - name: Run tests
      run: |
        go test -v -race -coverprofile=coverage.txt -covermode=atomic ./...

    - name: Generate config
      run: |
        ./scripts/generate_config.sh
        ./ppem --validate-config

    - name: Upload artifacts
      uses: actions/upload-artifact@v3
      with:
        name: ppem-${{ matrix.os }}-${{ matrix.arch }}
        path: |
          ppem
          ppem.config.json
          scripts/
          SETUP.md

    - name: Upload coverage
      if: matrix.os == 'ubuntu-latest' && matrix.arch == 'amd64'
      uses: codecov/codecov-action@v3
      with:
        file: ./coverage.txt
        flags: unittests

  docker:
    needs: build
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        lfs: true

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Login to DockerHub
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKER_USERNAME }}
        password: ${{ secrets.DOCKER_PASSWORD }}

    - name: Build and push Docker image
      uses: docker/build-push-action@v5
      with:
        context: .
        platforms: linux/amd64,linux/arm64
        push: true
        tags: |
          ${{ secrets.DOCKER_USERNAME }}/ppem-final:latest
          ${{ secrets.DOCKER_USERNAME }}/ppem-final:${{ github.sha }}
        cache-from: type=gha
        cache-to: type=gha,mode=max

  release:
    needs: build
    runs-on: ubuntu-latest
    if: github.event_name == 'release'
    
    steps:
    - name: Download all artifacts
      uses: actions/download-artifact@v3

    - name: Create release archives
      run: |
        for dir in ppem-*/; do
          name=${dir%/}
          tar czf "${name}.tar.gz" -C "$dir" .
        done

    - name: Upload release assets
      uses: softprops/action-gh-release@v1
      with:
        files: ppem-*.tar.gz
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}